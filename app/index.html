
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Metallic Earth</title>
    <link rel="stylesheet" href="stilo.css">

    <!-- script del modelo 3D -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
    </script>

</head>

<body>

    <!-- video de fondo -->
    <video autoplay muted loop playsinline id="video-fondo">
        <source src="src/VideoFondo3.mp4" type="video/mp4">
    </video>

    <div class="capa-fondo"></div>


    <!-- ENCABEZADO -->
    <header>
        <h1>Metallic Earth</h1>
        <nav>
            <a href="index.html" class="seleccionado">Inicio</a>
            <a href="AcercaDe.html">Acerca de</a>
            <a href="#">Ayuda</a>
            <a href="#">Configuración</a>   
        </nav>
    </header>

    <!-- contenido proncipal -->
    <main class="contenedor">

        <!-- Lista de objetos -->
        <aside class="lista">
            <h2>Lista de objetos</h2>
            <nav>
                <li><a href="#" class="seleccionado">Objeto 1</a> </li>
                <li><a href="#">Objeto 2</a></li>
                <li><a href="#">Objeto 3</a></li>
                <li><a href="#">Objeto 4</a></li>
                <li><a href="#">Objeto 5</a></li>
                <li><a href="#">Objeto 6</a></li>
            </nav>

        </aside>

        <!--Model viewer-->
        <section class="visualizacion">
            <div class="area-planeta">
            <model-viewer
                src="tierra/scene.gltf"
                alt="Modelo tridimensional de la Tierra"
                camera-controls
                auto-rotate
                disable-tap
                shadow-intensity="0.5"
                exposure="0.4">
            </model-viewer>
            </div>
        </section>

    </main>

    <!-- vinculacion con el javascript-->
    <script src="app.js"></script>
</body>

</html>
